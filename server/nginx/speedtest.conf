# Nginx front end for the speed-test server.
#
# The defaults that make Nginx a good web server make it a bad speed-test proxy.
# Every directive below exists to undo one of them — read the comments before
# trimming anything.

upstream speed_backend {
    server 127.0.0.1:8080;
    # Re-use upstream connections. Without this Nginx opens a fresh TCP
    # connection to Node for every chunk request and the download reads low.
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name speed.example.com;
    return 301 https://$host$request_uri;
}

server {
    # HTTP/2 matters here: the client runs 4-8 parallel streams, and on HTTP/1.1
    # the browser/RN per-host connection limit caps how many actually run.
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name speed.example.com;

    ssl_certificate     /etc/letsencrypt/live/speed.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/speed.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # THE important one. Compressing /download would let the client "receive"
    # far more bytes than crossed the wire and report a fantasy number.
    gzip off;
    # If your build has ngx_brotli compiled in, add `brotli off;` here too.
    # It is omitted by default because Nginx refuses to start on an unknown
    # directive, and stock builds do not ship the module.

    # Uploads are 100 MB+ and must stream through, not be spooled to disk first.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;

    # A slow cellular upload must not be cut off mid-body.
    client_body_timeout 300s;
    send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Nginx defaults to HTTP/1.0 upstream, which has no keep-alive.
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    location / {
        proxy_pass http://speed_backend;
    }

    # Nothing here is ever cacheable, at any layer.
    location = /download {
        proxy_pass http://speed_backend;
        add_header Cache-Control "no-store" always;
        # Let the kernel hand bytes straight to the socket.
        tcp_nodelay on;
        tcp_nopush off;
    }

    location = /ping {
        proxy_pass http://speed_backend;
        access_log off;
        tcp_nodelay on;
    }
}
